name: DEBUG — Provider Check (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPPRESS_CONFIG_WARNINGS: "1"
        run: |
          python3 -c "
from ai_client import check_all_providers, generate
import json
status = check_all_providers()
print(json.dumps(status, indent=2))
with open('logs/debug_providers.txt', 'w') as f:
    f.write(json.dumps(status, indent=2) + '\n\n')
    r = generate('Write one sentence about AI.', max_tokens=200)
    f.write('generate() result: ' + ('OK: ' + r.data['text'] if r else 'FAILED: ' + r.error))
"
      - run: |
          git config --global user.name "Debug Bot"
          git config --global user.email "debug@technova.world"
          git add logs/debug_providers.txt
          git commit -m "debug: provider check [skip ci]" || true
          git push || true
