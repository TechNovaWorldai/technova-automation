name: TechNova World — Weekly Content Batch

# ============================================================
# Har Sunday raat ko automatically poori week ka content
# generate karke queue mein daal deta hai. Phir Mon-Fri ka
# "post-linkedin.yml" workflow usse pick karke post karta hai.
# ============================================================

on:
  schedule:
    # Sunday 8:00 PM IST = 14:30 UTC
    - cron: '30 14 * * 0'
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics for Mon-Fri (optional — auto-picks trending if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-weekly-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate weekly content batch
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:        ${{ secrets.OPENROUTER_API_KEY }}
          SUPPRESS_CONFIG_WARNINGS:  "1"
          TOPICS_INPUT:              ${{ github.event.inputs.topics }}
        run: |
          python automation/weekly_batch.py

      - name: Commit generated content + queue
        run: |
          git config --global user.name "TechNova Automation Bot"
          git config --global user.email "automation@technova.world"
          git add generated/ queue/ logs/ || true
          git diff --staged --quiet || git commit -m "🤖 Weekly content batch generated [skip ci]"
          git push || echo "Nothing to push"
